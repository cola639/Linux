server {
    listen 80;
    server_name jenkins.gogogavin.uk;

    location / {
        proxy_pass http://127.0.0.1:8080;

        # Keep original host
        proxy_set_header Host $host;

        # Client IP (Cloudflare -> origin). Optional: configure real_ip_* for true client IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # IMPORTANT for Cloudflare Flexible SSL:
        # Use the proto Cloudflare sends (https), not $scheme (http on origin)
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-Ssl   on;

        # WebSocket support (Jenkins uses it in some places)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
