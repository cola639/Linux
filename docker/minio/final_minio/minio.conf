# ============================
# Shared ACME challenge snippet
# ============================
# Reuse via "include" so we don't duplicate it everywhere.
# Root path must match your certbot webroot: /var/www/letsencrypt
# Challenge URL: http://<host>/.well-known/acme-challenge/<token>

# (You can also save this as /www/conf/_acme.conf and include it.)
# Here we inline it using "include" style via a named location file is optional.

# ----------------------------
# MinIO API (host-based routing)
# ----------------------------
server {
    listen 80;
    server_name minio.gogogavin.uk minio.win-gavin.top;
    # ssl_certificate /www/cert/fullchain.pem;
    # ssl_certificate_key /www/cert/privatekey.pem;

    # ACME HTTP-01 validation (works even when Cloudflare is used)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Reverse proxy to MinIO API
    location / {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_pass http://127.0.0.1:9000;
    }
}

# ----------------------------
# MinIO Console (host-based routing + WebSocket)
# ----------------------------
server {
    listen 80;
    server_name console.gogogavin.uk console.win-gavin.top;
    # ssl_certificate /www/cert/fullchain.pem;
    # ssl_certificate_key /www/cert/privatekey.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_pass http://127.0.0.1:9001; 
    }
}
